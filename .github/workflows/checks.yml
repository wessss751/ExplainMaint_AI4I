name: Project checks
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_delivery.py
      - run: python -m pytest -q
      - run: python scripts/validate_notebook.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t explainmaint .
      - run: docker run -d --name explainmaint -p 7860:7860 explainmaint
      - name: Wait for the container
        run: |
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format='{{.State.Health.Status}}' explainmaint)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 3
          done
          docker logs explainmaint
          exit 1
      - run: python scripts/verify_deployment.py http://127.0.0.1:7860
      - if: always()
        run: docker logs explainmaint
