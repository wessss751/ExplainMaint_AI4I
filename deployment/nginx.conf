worker_processes auto;
pid /tmp/explainmaint-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    client_body_temp_path /tmp/explainmaint-client;
    proxy_temp_path /tmp/explainmaint-proxy;
    fastcgi_temp_path /tmp/explainmaint-fastcgi;
    uwsgi_temp_path /tmp/explainmaint-uwsgi;
    scgi_temp_path /tmp/explainmaint-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $http_x_forwarded_proto $forwarded_scheme {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 7860;
        server_name _;
        absolute_redirect off;
        client_max_body_size 16m;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;

        location = /api {
            return 307 /api/docs;
        }
        location /api/ {
            # A trailing slash strips /api/; FastAPI root_path restores it in docs.
            proxy_pass http://127.0.0.1:8000/;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
